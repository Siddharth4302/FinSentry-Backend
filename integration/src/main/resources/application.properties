spring.application.name=integration
server.port=8080

# Capgemini Generative Engine
finsentry.api-url=https://api.generative.engine.capgemini.com/v2/llm/invoke

finsentry.api-key=${FINSENTRY_API_KEY}

# Your FinSentry Knowledge Base ID
finsentry.knowledge-base-id=ff91300d-d2f9-49b7-8d1e-4074080a5ee1

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/finsentry
spring.datasource.username=postgres
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver
groq.api-key=${GROQ_API_KEY}
groq.model=openai/gpt-oss-20b

